; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32dev

; Freenove ESP32 WROOM (ESP32-WROOM-32 compatible)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<tests/>
; adjust upload_port/monitor_port if needed for your setup

; Standalone, low-current TMC5160 STEP/DIR oscillation test for carrier Rev.J.
; Select "tmc5160_oscillation" in PlatformIO's environment picker before
; Build/Upload. This environment intentionally excludes the normal firmware.
[env:tmc5160_oscillation]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/tmc5160_oscillation.cpp>

; Incremental encoder calibration/counting utility.
; Select "encoder_calibration", upload, then open the 115200-baud monitor.
[env:encoder_calibration]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/encoder_calibration.cpp>

; Staged hand-held upright balance test. It is deliberately separate from the
; normal application until encoder polarity and controller direction are proven.
[env:upright_balance_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/upright_balance_test.cpp>


; TMC5160 hardware/SPI diagnostics. Upload, open the 115200 monitor, then
; press d (register-level checks) or m (actual rotation).
[env:tmc5160_diagnostics]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/tmc5160_diagnostics.cpp>

; TMCStepDir (SD_MODE=1) STEP/DIR backend verification.
; Run this before trusting the backend in the main firmware.
[env:stepdir_backend_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/stepdir_backend_test.cpp>

; Integrated Pipeline: Energy Swing-up + Real Riccati LQR + Acceleration Control
[env:pipeline_energy_lqr]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/pipeline_energy_lqr.cpp>

; Rev.L J5, two HEDS encoders; USB power only, no motor commands.
[env:heds9100_test]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<tests/heds9100_test.cpp>

; Passive free-decay period measurement (no motor power).
[env:pendulum_period]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<tests/pendulum_period.cpp>

; One-shot internal ramp travel vs external ruler. No motion at boot.
[env:cart_distance_test]
extends = env:tmc5160_diagnostics
build_flags = -DCART_DISTANCE_TEST
monitor_filters = send_on_enter

[env:cart_step_loss_test]
extends = env:cart_distance_test
build_flags = -DCART_DISTANCE_TEST -DCART_STEP_LOSS

[env:double_upright]
extends = env:tmc5160_diagnostics
build_flags = -DDOUBLE_UPRIGHT
monitor_filters = log2file

[env:double_upright_trace]
extends = env:double_upright
build_flags = -DDOUBLE_UPRIGHT -DUPRIGHT_TRACE

; Rev.L system identification: free decay (motor OFF) and cart chirp with the
; links hanging. Logs go to the project's logs/ folder; fit with
; python simulation/sysid/fit.py <log files>. See simulation/sysid/README.md.
[env:double_sysid]
extends = env:tmc5160_diagnostics
build_flags = -DDOUBLE_SYSID
monitor_filters = log2file
