; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32dev

; Freenove ESP32 WROOM (ESP32-WROOM-32 compatible)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<tests/>
; adjust upload_port/monitor_port if needed for your setup

; Standalone, low-current TMC5160 STEP/DIR oscillation test for carrier Rev.J.
; Select "tmc5160_oscillation" in PlatformIO's environment picker before
; Build/Upload. This environment intentionally excludes the normal firmware.
[env:tmc5160_oscillation]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/tmc5160_oscillation.cpp>

; Incremental encoder calibration/counting utility.
; Select "encoder_calibration", upload, then open the 115200-baud monitor.
[env:encoder_calibration]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/encoder_calibration.cpp>

; Staged hand-held upright balance test. It is deliberately separate from the
; normal application until encoder polarity and controller direction are proven.
[env:upright_balance_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/upright_balance_test.cpp>


; TMC5160 hardware/SPI diagnostics. Upload, open the 115200 monitor, then
; press d (register-level checks) or m (actual rotation).
[env:tmc5160_diagnostics]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/tmc5160_diagnostics.cpp>

; TMCStepDir (SD_MODE=1) STEP/DIR backend verification.
; Run this before trusting the backend in the main firmware.
[env:stepdir_backend_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/stepdir_backend_test.cpp>
