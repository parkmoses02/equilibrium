; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; Freenove ESP32 WROOM (ESP32-WROOM-32 compatible)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<tests/>
; adjust upload_port/monitor_port if needed for your setup

; Incremental encoder calibration/counting utility.
; Select "encoder_calibration", upload, then open the 115200-baud monitor.
[env:encoder_calibration]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/encoder_calibration.cpp>
