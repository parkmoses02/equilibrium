; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32dev

; Freenove ESP32 WROOM (ESP32-WROOM-32 compatible)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<tests/>
; adjust upload_port/monitor_port if needed for your setup

; Standalone, low-current TMC5160 STEP/DIR oscillation test for carrier Rev.J.
; Select "tmc5160_oscillation" in PlatformIO's environment picker before
; Build/Upload. This environment intentionally excludes the normal firmware.
[env:tmc5160_oscillation]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/tmc5160_oscillation.cpp>

; Incremental encoder calibration/counting utility.
; Select "encoder_calibration", upload, then open the 115200-baud monitor.
[env:encoder_calibration]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/encoder_calibration.cpp>

; Staged hand-held upright balance test. It is deliberately separate from the
; normal application until encoder polarity and controller direction are proven.
[env:upright_balance_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/upright_balance_test.cpp>


; TMC5160 hardware/SPI diagnostics. Upload, open the 115200 monitor, then
; press d (register-level checks) or m (actual rotation).
[env:tmc5160_diagnostics]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/tmc5160_diagnostics.cpp>

; TMCStepDir (SD_MODE=1) STEP/DIR backend verification.
; Run this before trusting the backend in the main firmware.
[env:stepdir_backend_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/stepdir_backend_test.cpp>

; Integrated Pipeline: Energy Swing-up + Real Riccati LQR + Acceleration Control
[env:pipeline_energy_lqr]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/pipeline_energy_lqr.cpp>

[env:uart_link_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<tests/uart_link_test.cpp>

[env:uart_motor_noise_test]
; lib/TMC uses the Arduino-ESP32 2.x API (ledcSetup, GPIO_PIN_MUX_REG): pin the 6.x platform (core 2.0.17)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; ESP32 board = CH340. The AI-G debug console (CP2102) is also on USB: never upload to it.
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
build_src_filter =
    -<*>
    +<tests/uart_motor_noise_test.cpp>

; Step 1 of the camera pipeline: encoder + camera angle log (no motor), see tools/camera_delay_xcorr.py
[env:camera_delay_log]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
; ESP32 board = CH340. The AI-G debug console (CP2102) is also on USB: never upload to it.
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
build_src_filter =
    -<*>
    +<tests/camera_delay_log.cpp>

; Cart-acceleration calibration (cart chirp, pendulum hanging), see tools/cart_accel_fit.py
[env:cart_accel_log]
; lib/TMC uses the Arduino-ESP32 2.x API (ledcSetup, GPIO_PIN_MUX_REG): pin the 6.x platform (core 2.0.17)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
; ESP32 board = CH340. The AI-G debug console (CP2102) is also on USB: never upload to it.
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
build_src_filter =
    -<*>
    +<tests/cart_accel_log.cpp>
