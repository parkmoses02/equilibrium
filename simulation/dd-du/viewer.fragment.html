<div id="du-lab">
<style>
#du-lab{font-family:system-ui,sans-serif;max-width:880px;margin:auto;color:var(--foreground,CanvasText);display:grid;gap:.8rem}
#du-lab svg{width:100%;height:auto;display:block}#du-lab .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem}#du-lab input[type=range]{flex:1;min-width:100px}#du-lab output{font-variant-numeric:tabular-nums}#du-lab label{display:inline-flex;align-items:center;gap:.4rem}#du-lab svg text{fill:currentColor;font:12px system-ui}#du-lab .rail{stroke:currentColor;opacity:.4}#du-lab .base{stroke:var(--viz-series-1,#447ab9)}#du-lab .tip{stroke:var(--viz-series-2,#d87d35)}
</style>
<header><h2>DD → DU 궤적 탐색</h2><span>실측 모델 · 카트 ±30 cm · 0.8 m/s · 16 m/s² 이내</span></header>
<div class="toolbar"><button class="btn btn-primary" data-id="run">탐색 시작</button><output data-id="status" aria-live="polite"></output></div>
<div class="toolbar"><label>후보 <select class="form-select" data-id="candidate"></select></label>
<label>재검증 <select class="form-select" data-id="case"><option value="nominal">기준 모델</option><option value="offset">첫 링크 초기각 +1°</option><option value="delay">가속도 응답 5 ms 지연</option></select></label></div>
<svg viewBox="0 0 720 325" role="img" aria-label="레일 위의 카트, 첫 링크와 끝 링크의 실제 계산 자세">
<path class="rail" d="M105 153H615 M105 143V163 M360 147V159 M615 143V163"/><text x="78" y="182">−30 cm</text><text x="591" y="182">+30 cm</text>
<rect data-id="cart" width="36.55" height="13" rx="3" y="140" fill="currentColor"/>
<path data-id="arm1" class="base" stroke-width="6" fill="none"/><path data-id="arm2" class="tip" stroke-width="5" fill="none"/>
<circle data-id="joint" r="6" fill="currentColor"/><circle data-id="mass" r="5" fill="currentColor"/>
</svg>
<div class="toolbar"><button class="btn" data-id="play">재생</button><input class="form-range" data-id="time" type="range" min="0" value="0" aria-label="궤적 시간"><output data-id="clock"></output></div>
<output data-id="state"></output><output data-id="result"></output>
<small>포착 판정은 계획 끝에서 한 번. 모델: 마찰 없음 · 카트 가속도 입력 · 포착 후 엔코더 양자화 및 5 ms LQR. 실기 결과 아님.</small>
</div>
<script>
/*MODEL*/
;(()=>{
const root=document.getElementById('du-lab'),el=k=>root.querySelector('[data-id="'+k+'"]');
let bank=[],traj=null,gen=null,running=false,playing=false,frame=0,last=0,iter=0;
const stopAt=(N+1)*stride,deg=x=>wrap(x)*180/Math.PI;
function draw(){
 const [t,x,a,b,v,w,z,u]=traj.frames[frame],cx=360+850*x,cy=146;
 // Equal physical scale on both axes; camera follows the rail, not the cart.
 const jx=cx+136*Math.sin(a),jy=cy-136*Math.cos(a),ex=jx+140.25*Math.sin(b),ey=jy-140.25*Math.cos(b);
 const svg=el('cart').ownerSVGElement;svg.setAttribute('viewBox','0 -152 720 610');
 el('cart').setAttribute('x',cx-36.55/2);
 for(const [k,x1,y1,x2,y2] of [['arm1',cx,cy,jx,jy],['arm2',jx,jy,ex,ey]])el(k).setAttribute('d','M'+x1+' '+y1+'L'+x2+' '+y2);
 for(const [k,px,py] of [['joint',jx,jy],['mass',ex,ey]]){el(k).setAttribute('cx',px);el(k).setAttribute('cy',py);}
 el('time').value=frame;el('clock').textContent=t.toFixed(2)+' s · '+(frame>stopAt?'e 평형 유지':'스윙업');
 el('state').textContent='카트 '+(x*100).toFixed(1)+' cm  ·  속도 '+v.toFixed(2)+' m/s  ·  가속도 '+u.toFixed(1)+' m/s²';
 el('result').textContent=(traj.held?'DU 포착 · 2초 유지 성공':traj.caught?'포착 후 유지 실패':'DU 미포착')+'  |  포착 시점 목표 오차: 첫 링크 '+deg(traj.ea).toFixed(1)+'°, 끝 링크 '+deg(traj.eb).toFixed(1)+'°  |  각속도 '+traj.end[4].toFixed(2)+' / '+traj.end[5].toFixed(2)+' rad/s';
}
function choose(reset=true){
 traj=sim(bank[+el('candidate').value].v,true,2,el('case').value);
 frame=reset?0:Math.min(frame,traj.frames.length-1);el('time').max=traj.frames.length-1;draw();
}
function add(v,label){let i=bank.push({v})-1;el('candidate').add(new Option(label,i));el('candidate').value=i;choose(false);}
function play(on){playing=on;el('play').textContent=on?'일시정지':'재생';last=performance.now();}
function tick(now){
 if(playing && now-last>=dt*1000){let n=Math.floor((now-last)/(dt*1000));last+=n*dt*1000;frame=Math.min(frame+n,traj.frames.length-1);draw();if(frame===traj.frames.length-1)play(false);}
 requestAnimationFrame(tick);
}
function work(){
 if(!running)return;const until=performance.now()+25;
 do{let step=gen.next();if(step.done){running=false;el('run').textContent='처음부터 다시 탐색';el('status').textContent='탐색 종료 · 개선 후보 '+(bank.length-1)+'개';frame=0;choose();play(true);return;}
 iter++;if(step.value){const c=step.value;add(c.v,'후보 '+bank.length+' · 비용 '+c.result.score.toFixed(4));}
 }while(performance.now()<until);
 el('status').textContent='탐색 중 · 반복 '+iter+' · 개선 후보 '+(bank.length-1)+'개';setTimeout(work,10);
}
el('run').onclick=()=>{if(running){running=false;el('run').textContent='탐색 계속';el('status').textContent='탐색 일시정지';return;}
 if(!gen||el('run').textContent.includes('처음')){gen=search();bank.length=0;el('candidate').length=0;add(Array(N).fill(0),'초기 · 정지');iter=0;}
 running=true;el('run').textContent='탐색 일시정지';play(true);work();};
el('candidate').onchange=()=>{if(running)el('run').click();choose();play(true);};
el('case').onchange=()=>{if(running)el('run').click();choose();play(true);};
el('play').onclick=()=>{if(frame===traj.frames.length-1)frame=0;play(!playing);draw();};
el('time').oninput=()=>{play(false);frame=+el('time').value;draw();};
add(Array(N).fill(0),'초기 · 정지');el('status').textContent='DD 정지 상태';requestAnimationFrame(tick);
})();
</script>
