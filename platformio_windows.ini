; Windows ESP32 USB port. Check the CH340 in Device Manager before upload.
[windows_serial]
port = COM3

[env:camera_control_windows]
extends = env:camera_control
upload_port = ${windows_serial.port}
monitor_port = ${windows_serial.port}

[env:camera_pipeline_windows]
extends = env:camera_pipeline
upload_port = ${windows_serial.port}
monitor_port = ${windows_serial.port}
build_flags = -DAIG_CAMERA_UART_BAUD=115200

[env:camera_estimator_test_windows]
extends = env:camera_estimator_test
upload_port = ${windows_serial.port}
monitor_port = ${windows_serial.port}
build_flags = -DAIG_CAMERA_UART_BAUD=115200

[env:camera_delay_log_windows]
extends = env:camera_delay_log
upload_port = ${windows_serial.port}
monitor_port = ${windows_serial.port}
build_flags = -DAIG_CAMERA_UART_BAUD=115200

[env:cart_accel_log_windows]
extends = env:cart_accel_log
upload_port = ${windows_serial.port}
monitor_port = ${windows_serial.port}
build_flags = -DAIG_CAMERA_UART_BAUD=115200
