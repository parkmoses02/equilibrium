; Extra PlatformIO config for the camera viewer firmware. Kept in its own file so platformio.ini and
; platformio_windows.ini stay untouched:
;   platformio run -c platformio_camview.ini -e camera_view_windows -t upload --upload-port COM3
; Same settings as camera_control_windows, only the source file differs.
[platformio]
extra_configs = platformio.ini

[env:camera_view_windows]
extends = env:camera_control
upload_port = COM3
monitor_port = COM3
build_src_filter =
    -<*>
    +<tests/camera_view_fw.cpp>
